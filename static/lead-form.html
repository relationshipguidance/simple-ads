<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Enquire Now</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 20px; }
    h1 { font-size: 22px; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { background: #4f46e5; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 16px; width: 100%; }
    .msg { padding: 12px; border-radius: 8px; margin-top: 12px; }
    .ok { background: #d1fae5; color: #065f46; }
    .err { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <h1>Get in Touch</h1>
  <p style="color:#666;font-size:14px;">Fill out this quick form and we'll get back to you.</p>

  <form id="leadForm">
    <input type="hidden" id="adId" />
    <label>Name</label>
    <input id="name" required />
    <label>Email</label>
    <input id="email" type="email" required />
    <label>Phone</label>
    <input id="phone" type="tel" />
    <label>When do you want to start?</label>
    <select id="timing">
      <option value="immediately">Immediately</option>
      <option value="1month">Within 1 month</option>
      <option value="3months">1-3 months</option>
      <option value="researching">Just researching</option>
    </select>
    <label>Message</label>
    <textarea id="message" rows="3"></textarea>
    <button type="submit">Submit Enquiry</button>
  </form>
  <div id="result"></div>

  <script>
    // Read ad_id from URL
    const params = new URLSearchParams(window.location.search);
    const adId = params.get('ad_id');
    if (adId) document.getElementById('adId').value = adId;

    document.getElementById('leadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        ad_id: document.getElementById('adId').value,
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        timing: document.getElementById('timing').value,
        message: document.getElementById('message').value,
      };

      const res = await fetch('/api/lead', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      if (res.ok) {
        document.getElementById('result').className = 'msg ok';
        document.getElementById('result').textContent = 'Thank you! We will be in touch shortly.';
        document.getElementById('leadForm').reset();
      } else {
        document.getElementById('result').className = 'msg err';
        document.getElementById('result').textContent = 'Something went wrong. Please try again.';
      }
    });
  </script>
</body>
</html>
