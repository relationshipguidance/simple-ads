<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Enquire Now</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 20px; background: #f9fafb; }
    h1 { font-size: 22px; color: #1a1f36; }
    .sub { color:#666;font-size:14px;margin-bottom:20px; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; font-weight: 600; color:#333; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size:14px; }
    button { background: #4f46e5; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 16px; width: 100%; font-size:14px; }
    button:hover { background: #4338ca; }
    .msg { padding: 12px; border-radius: 8px; margin-top: 12px; font-size:14px; }
    .ok { background: #d1fae5; color: #065f46; }
    .err { background: #fee2e2; color: #991b1b; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Get in Touch</h1>
  <p class="sub">Fill out this quick form and we'll connect you with the right offer.</p>

  <form id="leadForm">
    <input type="hidden" id="adId" />
    <input type="hidden" id="adUrl" />

    <label>Name</label>
    <input id="name" required />

    <label>Email</label>
    <input id="email" type="email" required />

    <label>Phone</label>
    <input id="phone" type="tel" />

    <label>When do you want to start?</label>
    <select id="timing">
      <option value="immediately">Immediately</option>
      <option value="1month">Within 1 month</option>
      <option value="3months">1-3 months</option>
      <option value="researching">Just researching</option>
    </select>

    <label>Message</label>
    <textarea id="message" rows="3"></textarea>

    <button type="submit">Submit & Continue →</button>
  </form>

  <div id="result"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const adId = params.get('ad_id');
    if (adId) document.getElementById('adId').value = adId;

    document.getElementById('leadForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        ad_id: document.getElementById('adId').value,
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        timing: document.getElementById('timing').value,
        message: document.getElementById('message').value,
      };

      const res = await fetch('/api/lead', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      if (res.ok) {
        const data = await res.json();
        document.getElementById('result').className = 'msg ok';
        document.getElementById('result').textContent = 'Thank you! Redirecting...';

        // Hide the form and redirect to advertiser URL
        document.getElementById('leadForm').classList.add('hidden');
        setTimeout(() => {
          window.location.href = data.redirect_url || 'https://example.com';
        }, 1500);
      } else {
        document.getElementById('result').className = 'msg err';
        document.getElementById('result').textContent = 'Something went wrong. Please try again.';
      }
    });
  </script>
</body>
</html>
